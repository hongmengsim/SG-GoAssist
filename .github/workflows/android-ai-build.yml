name: Android AI build

on:
  workflow_dispatch:

jobs:
  verify-model-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run model:prepare --workspace @buspass/app
      - run: npx expo prebuild --platform android --no-install
        working-directory: packages/app
        env:
          GOASSIST_REQUIRE_AI_MODEL: "1"
      - run: npm run typecheck
