name: CI

# Every module is checked on its own, so a failure names the module. The steps mirror
# `npm run verify` (see scripts/modules.json). It has run on GitHub since 30 Sep 2026; the postgres-redis job was added on 1 Oct 2026 and has not run yet.

on:
  push:
    branches: [main, integration]
  pull_request:

jobs:
  node-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:modules
      - run: npm run test:modules
      - run: npm run format:check
      - name: contracts (schema drift and fixtures)
        run: npm test --workspace @buspass/shared
      - name: backend
        run: npm test --workspace @buspass/backend
      - name: operator console
        run: npm test
        working-directory: operator-console

  python-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [pi/tof-link, pi/perception, pi/safety-gate, pi/bus-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests use fakes; the hardware libraries (picamera2, ultralytics, opencv) are not needed.
      - run: pip install jsonschema websockets pyserial
      - name: ${{ matrix.module }}
        run: python -m unittest
        working-directory: ${{ matrix.module }}

  contracts-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python -m unittest discover -s contracts/python

  passenger-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace @buspass/app

  postgres-redis:
    # The Postgres and Redis adapters, and two real backend processes sharing them
    # (decision 0005). pg and ioredis are not dependencies of the backend, so they are installed
    # here without saving them.
    runs-on: ubuntu-latest
    needs: [node-modules]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goassist
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: goassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goassist" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Only the test suite's Postgres tests read this one (each in a throwaway schema).
      GOASSIST_TEST_DATABASE_URL: postgres://goassist:ci-only-password@localhost:5432/goassist
      GOASSIST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --workspace @buspass/backend pg ioredis
      - name: backend tests, including the Postgres adapters
        run: npm test --workspace @buspass/backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema websockets pyserial
      # The two-process steps hand the backend a database of their own, so it is set here and
      # not for the whole job: the ordinary tests must never pick it up.
      - name: two real backend processes sharing Postgres, Redis and locks
        run: npm run check:multi-process
        env:
          GOASSIST_DATABASE_URL: postgres://goassist:ci-only-password@localhost:5432/goassist
      - name: the whole end-to-end scenario across two processes
        run: npm run e2e:scenario:two
        env:
          GOASSIST_DATABASE_URL: postgres://goassist:ci-only-password@localhost:5432/goassist

  end-to-end:
    runs-on: ubuntu-latest
    needs: [node-modules, python-modules]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install jsonschema websockets pyserial
      - run: npm run build --workspace @buspass/backend
      - name: scenario (real backend, two simulated buses, a third for a stalled deployment)
        run: python scripts/e2e_scenario.py
      - name: overload (browsing is shed, buses are still heard)
        run: node scripts/load-test.mjs --overload --rate 200 --seconds 6
