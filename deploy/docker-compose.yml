# Postgres, Redis and two backend processes sharing them.  NOT YET RUN (no Docker where this was
# written): a starting point that follows docs/runbooks/multi-process.md. Copy .env.example to
# .env and set every value before `docker compose -f deploy/docker-compose.yml up --build`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: goassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: goassist
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goassist"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10
  backend-a: &backend
    build: { context: .., dockerfile: deploy/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PORT: "3000"
      GOASSIST_DATABASE_URL: postgres://goassist:${POSTGRES_PASSWORD}@postgres:5432/goassist
      GOASSIST_EVENT_BUS: redis
      GOASSIST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      GOASSIST_LOCKS: database
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:?set OPERATOR_API_TOKEN}
      DEVICE_SHARED_SECRET: ${DEVICE_SHARED_SECRET:?set DEVICE_SHARED_SECRET}
      GOASSIST_DATA_DIR: /data
    volumes: [backend-a-data:/data]
    ports: ["3000:3000"]
  backend-b:
    <<: *backend
    volumes: [backend-b-data:/data]
    ports: ["3010:3000"]
volumes:
  pgdata: {}
  backend-a-data: {}
  backend-b-data: {}
