<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoAssist Operations</title>
  <style>
    :root { color-scheme: light; --ink:#173638; --teal:#075b73; --cyan:#9ddcea; --paper:#f3f8f8; --line:#b9cccf; --alert:#9d2929; --amber:#8a5900; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
    button { font:inherit; }
    .shell { max-width:1440px; margin:auto; padding:24px; }
    header { display:flex; gap:18px; align-items:center; justify-content:space-between; margin-bottom:20px; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:clamp(1.7rem,4vw,2.6rem); }
    .live { display:flex; align-items:center; gap:9px; font-weight:800; }
    .dot { width:12px; height:12px; border-radius:50%; background:#198754; box-shadow:0 0 0 5px #d8f2e5; }
    .metrics { display:grid; grid-template-columns:repeat(6,minmax(130px,1fr)); gap:12px; margin-bottom:18px; }
    .metric,.panel,.case { background:white; border:2px solid var(--line); border-radius:18px; }
    .metric { padding:15px; }
    .metric strong { display:block; font-size:1.7rem; }
    .metric span,.muted { color:#536d72; font-weight:650; }
    .layout { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(320px,.75fr); gap:18px; }
    .panel { padding:18px; }
    .panel-head { display:flex; justify-content:space-between; gap:12px; align-items:end; margin-bottom:14px; }
    .queue { display:grid; gap:12px; }
    .case { padding:16px; border-color:#91afb4; cursor:pointer; text-align:left; width:100%; color:inherit; }
    .case:hover,.case:focus-visible { outline:4px solid var(--cyan); outline-offset:2px; }
    .case.selected { border-color:var(--teal); background:#eaf7fa; }
    .case-top { display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .state { border-radius:999px; padding:5px 10px; color:white; background:var(--teal); font-size:.8rem; font-weight:900; }
    .state.BLOCKED,.state.FAILED,.state.ESCALATED { background:var(--alert); }
    .state.NEEDS_CONFIRMATION { background:var(--amber); }
    .tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
    .tag { padding:4px 8px; background:#e7f0f1; border-radius:8px; font-weight:700; font-size:.82rem; }
    .detail-empty { min-height:260px; display:grid; place-items:center; color:#647b80; text-align:center; }
    .checklist { list-style:none; padding:0; display:grid; gap:8px; }
    .checklist li { display:flex; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid #dce7e9; }
    .ok { color:#126b43; font-weight:900; } .bad { color:var(--alert); font-weight:900; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:14px; }
    .actions button { min-height:48px; border:2px solid var(--teal); border-radius:12px; background:white; color:var(--teal); font-weight:850; cursor:pointer; }
    .actions button.primary { background:var(--teal); color:white; }
    .actions button.danger { border-color:var(--alert); color:var(--alert); }
    .empty { padding:35px; text-align:center; color:#60777c; }
    @media (max-width:900px) { .metrics{grid-template-columns:repeat(2,1fr)} .layout{grid-template-columns:1fr} }
    @media (max-width:520px) { .shell{padding:14px} .metrics{grid-template-columns:1fr 1fr} header{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="muted">SG GoAssist</p><h1>Assistance operations</h1></div>
      <div class="live"><span class="dot" id="connection-dot"></span><span id="connection">Connecting…</span></div>
    </header>
    <section class="metrics" aria-label="Live performance metrics">
      <div class="metric"><span>Active cases</span><strong id="m-active">–</strong></div>
      <div class="metric"><span>Need attention</span><strong id="m-attention">–</strong></div>
      <div class="metric"><span>Acknowledgement p95</span><strong id="m-ack">–</strong></div>
      <div class="metric"><span>Safety blocks</span><strong id="m-blocks">–</strong></div>
      <div class="metric"><span>Devices online</span><strong id="m-devices">–</strong></div>
      <div class="metric"><span>Perception precision</span><strong id="m-perception">–</strong></div>
    </section>
    <div class="layout">
      <section class="panel">
        <div class="panel-head"><div><p class="muted">MULTI-VEHICLE QUEUE</p><h2>Passenger assistance</h2></div><span id="updated" class="muted"></span></div>
        <div id="queue" class="queue" aria-live="polite"></div>
      </section>
      <aside class="panel" aria-live="polite">
        <div id="detail" class="detail-empty">Select a case to inspect intent, safety clearance, and vehicle action.</div>
      </aside>
    </div>
  </main>
  <script>
    const api = '/api/operations';
    const token = new URLSearchParams(location.search).get('token') || localStorage.getItem('goassistOperatorToken') || '';
    if (token) localStorage.setItem('goassistOperatorToken', token);
    const terminal = new Set(['COMPLETED','FAILED','CANCELLED']);
    let cases = [], selectedId;
    const el = id => document.getElementById(id);
    const label = value => String(value || '').replaceAll('_',' ').toLowerCase().replace(/^./, c => c.toUpperCase());
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const bool = value => value ? '<span class="ok">Clear</span>' : '<span class="bad">Blocked</span>';
    async function json(path, options={}) { const response = await fetch(api + path, {...options,headers:{...(options.headers||{}),...(token?{Authorization:'Bearer '+token}:{})}}); if (!response.ok) throw new Error(await response.text()); return response.json(); }
    async function refresh() {
      try {
        const [caseData, metrics, devices, perception] = await Promise.all([json('/cases'), json('/metrics'), json('/devices'), json('/perception/metrics')]);
        cases = caseData.cases;
        el('m-active').textContent = metrics.activeCases;
        el('m-attention').textContent = cases.filter(x => ['BLOCKED','FAILED','ESCALATED','NEEDS_CONFIRMATION'].includes(x.state)).length;
        el('m-ack').textContent = metrics.acknowledgementP95Ms == null ? '–' : metrics.acknowledgementP95Ms + ' ms';
        el('m-blocks').textContent = metrics.safetyBlocks;
        el('m-devices').textContent = devices.devices.filter(x => x.networkOnline && Date.now() - Date.parse(x.observedAt) < 15000).length;
        el('m-perception').textContent = perception.microPrecision == null ? '–' : Math.round(perception.microPrecision*100) + '%';
        el('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
        renderQueue(); renderDetail();
      } catch (error) { el('connection').textContent = 'API unavailable'; el('connection-dot').style.background = '#9d2929'; }
    }
    function renderQueue() {
      const queue = el('queue'); queue.replaceChildren();
      if (!cases.length) { const empty=document.createElement('p'); empty.className='empty'; empty.textContent='No assistance cases yet.'; queue.append(empty); return; }
      cases.forEach(item => {
        const button=document.createElement('button'); button.className='case'+(selectedId===item.caseId?' selected':'');
        button.innerHTML=`<div class="case-top"><div><strong>${esc(item.busService || item.busId || 'Bus unassigned')}</strong> · Stop ${esc(item.stopCode)}<br><span class="muted">${item.passengerCount} passenger${item.passengerCount===1?'':'s'} · ${item.intents.length} intent${item.intents.length===1?'':'s'}</span></div><span class="state ${esc(item.state)}">${esc(label(item.state))}</span></div><div class="tags">${item.assistanceTypes.map(x=>`<span class="tag">${esc(label(x))}</span>`).join('')}</div>${item.escalationReason?`<p class="bad" style="margin-top:10px">${esc(item.escalationReason)}</p>`:''}`;
        button.onclick=()=>{selectedId=item.caseId;renderQueue();renderDetail();}; queue.append(button);
      });
    }
    async function renderDetail() {
      const host=el('detail'), item=cases.find(x=>x.caseId===selectedId);
      if(!item){host.className='detail-empty';host.textContent='Select a case to inspect intent, safety clearance, and vehicle action.';return;}
      host.className=''; let telemetry, autonomy;
      if(item.busId){
        try{telemetry=await json('/vehicles/'+encodeURIComponent(item.busId)+'/telemetry')}catch{}
        try{autonomy=await json('/vehicles/'+encodeURIComponent(item.busId)+'/autonomy')}catch{}
      }
      const checks=telemetry?`<ul class="checklist"><li>Vehicle stopped ${bool(telemetry.vehicleStopped)}</li><li>Parking brake ${bool(telemetry.parkingBrakeActive)}</li><li>Door open ${bool(telemetry.doorOpen)}</li><li>Ramp path ${bool(telemetry.deploymentPathClear)}</li><li>Ramp position <strong>${label(telemetry.rampPosition)}</strong></li></ul>`:'<p class="muted">Waiting for vehicle safety telemetry.</p>';
      const autonomyPanel=autonomy?`<h3 style="margin-top:16px">Autonomous vehicle</h3><ul class="checklist"><li>Drive state <strong>${esc(label(autonomy.state))}</strong></li><li>Mode <strong>${esc(label(autonomy.mode))}</strong></li><li>Target stop <strong>${esc(autonomy.targetStopCode)}</strong></li><li>Distance <strong>${Math.round(autonomy.distanceToTargetMeters)} m</strong></li><li>Speed <strong>${Math.round(autonomy.speedKph)} km/h</strong></li></ul>${autonomy.blockReason?`<p class="bad">${esc(autonomy.blockReason)}</p>`:''}<div class="actions"><button class="danger" data-autonomy="STOP">Safety stop</button><button data-autonomy="MANUAL">Manual control</button><button class="primary" data-autonomy="RESUME">Resume after checks</button></div>`:'';
      const intent=item.boardingIntent||{decision:'UNCONFIRMED',confidence:0,reason:'Waiting for evidence'};
      host.innerHTML=`<p class="muted">CASE ${esc(item.caseId.slice(-8).toUpperCase())}</p><h2>${esc(item.busService||item.busId||'Vehicle needed')} · Stop ${esc(item.stopCode)}</h2><p style="margin:8px 0 6px">${item.intents.filter(x=>x.confirmed).length} of ${item.intents.length} intents confirmed · confidence ${Math.round(item.confidence*100)}%</p><p style="margin:0 0 14px"><strong>Boarding intent: ${esc(label(intent.decision))}</strong> · ${Math.round(intent.confidence*100)}%<br><span class="muted">${esc(intent.reason)}</span></p>${autonomyPanel}<h3 style="margin-top:16px">Safety clearance</h3>${checks}<h3 style="margin-top:16px">Action plan</h3><ul>${item.actionPlan.map(x=>`<li>${esc(label(x.action))} — ${esc(label(x.status))}</li>`).join('')}</ul><div class="actions"><button class="primary" data-action="CONFIRM">Confirm intent</button><button data-action="RETRY">Retry checks</button><button data-action="ESCALATE">Escalate</button><button class="primary" data-action="COMPLETE">Complete</button><button class="danger" data-action="CANCEL">Cancel case</button></div>`;
      host.querySelectorAll('button[data-action]').forEach(button=>button.onclick=()=>act(item.caseId,button.dataset.action));
      host.querySelectorAll('button[data-autonomy]').forEach(button=>button.onclick=()=>autonomyAct(item.busId,button.dataset.autonomy));
    }
    async function act(caseId, action){ await json('/cases/'+caseId+'/operator',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})}); await refresh(); }
    async function autonomyAct(busId, action){ const clearance=action==='RESUME'?{obstacleCleared:true,localizationAccuracyMeters:5}:{}; await json('/vehicles/'+encodeURIComponent(busId)+'/autonomy/override',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...clearance})}); await refresh(); }
    function connect(){ const ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host); ws.onopen=()=>ws.send(JSON.stringify({type:'SUBSCRIBE_OPERATIONS',token})); ws.onmessage=()=>refresh(); ws.onclose=()=>{el('connection').textContent='Reconnecting…';setTimeout(connect,1500)}; ws.onerror=()=>ws.close(); ws.addEventListener('open',()=>{el('connection').textContent='Live';el('connection-dot').style.background='#198754'}); }
    refresh(); connect(); setInterval(refresh,5000);
  </script>
</body>
</html>
